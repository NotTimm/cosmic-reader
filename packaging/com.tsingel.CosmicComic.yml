# Flatpak manifest.
#
# Note this builds from the local checkout (`type: dir`) so it works
# offline and matches whatever you have committed. For a published build,
# switch the source to `type: git` with a tag, and add a cargo-sources.json
# generated by flatpak-builder-tools so the build is fully offline/reproducible.
app-id: com.tsingel.CosmicComic
runtime: org.freedesktop.Platform
runtime-version: '24.08'
sdk: org.freedesktop.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: cosmic-comic

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
  env:
    CARGO_HOME: /run/build/cosmic-comic/cargo

finish-args:
  - --socket=wayland
  - --socket=fallback-x11
  - --share=ipc
  - --device=dri
  # Network access is used only for optional metadata/cover lookups
  # (AniList, ComicVine).
  - --share=network
  # Comics live in the user's own files; the portal handles anything else.
  - --filesystem=home:ro
  - --filesystem=xdg-documents:ro
  - --filesystem=xdg-download:ro

modules:
  - name: cosmic-comic
    buildsystem: simple
    build-commands:
      - cargo --offline fetch --manifest-path Cargo.toml || cargo fetch
      - cargo build --release
      - install -Dm0755 target/release/cosmic-comic /app/bin/cosmic-comic
      - install -Dm0644 res/com.tsingel.CosmicComic.desktop
        /app/share/applications/com.tsingel.CosmicComic.desktop
      - install -Dm0644 res/icons/com.tsingel.CosmicComic.svg
        /app/share/icons/hicolor/scalable/apps/com.tsingel.CosmicComic.svg
      - install -Dm0644 res/com.tsingel.CosmicComic.metainfo.xml
        /app/share/metainfo/com.tsingel.CosmicComic.metainfo.xml
    sources:
      - type: dir
        path: ..
