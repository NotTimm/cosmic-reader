[package]
name = "cosmic-comic"
version = "0.1.0-beta.1"
edition = "2021"
license = "GPL-3.0-only"
description = "A native COSMIC desktop comic book (.cbz/.cbr) reader"

[dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread", "sync"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
compress-tools = "0.15"
zip = "2"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }
quick-xml = "0.37"

# Fork of pop-os/libcosmic with three patches on top of pop-os/libcosmic:
# 1. Forwards winit's trackpad pinch gesture (WindowEvent::PinchGesture)
#    through iced as mouse::Event::WheelZoomed, which upstream iced drops
#    entirely.
# 2. In image::Viewer, lets a physical mouse wheel zoom without Ctrl (it
#    reports discrete ScrollDelta::Lines, unambiguous with scrolling)
#    while keeping trackpad two-finger scroll (ScrollDelta::Pixels)
#    Ctrl-gated for zoom, since that's ambiguous with panning intent.
# 3. In image::Viewer, trackpad two-finger scroll without Ctrl pans a
#    zoomed-in image instead of doing nothing — free diagonal movement,
#    since x/y move independently.
# Re-sync by rebasing NotTimm/libcosmic's commits onto a newer
# pop-os/libcosmic and updating `rev` below.
[dependencies.libcosmic]
git = "https://github.com/NotTimm/libcosmic.git"
rev = "afd5f9e008681f1961d093d87b8735cd17405f5a"
default-features = false
features = ["dbus-config", "wgpu", "wayland", "winit", "tokio", "xdg-portal", "multi-window"]

[profile.release]
lto = true
