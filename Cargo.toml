[package]
name = "cosmic-comic"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
description = "A native COSMIC desktop comic book (.cbz/.cbr) reader"

[dependencies]
env_logger = "0.11"
tokio = { version = "1", features = ["fs", "io-util", "rt-multi-thread"] }
url = "2.5"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "bmp",
] }
compress-tools = "0.15"
zip = "2"
arboard = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json"] }
rusqlite = { version = "0.31", features = ["bundled"] }

# Fork of pop-os/libcosmic that forwards winit's trackpad pinch gesture
# (WindowEvent::PinchGesture) through iced as mouse::Event::WheelZoomed,
# which upstream iced drops entirely. See NotTimm/libcosmic's single commit
# on top of pop-os/libcosmic for the diff. Re-sync by rebasing that commit
# onto a newer pop-os/libcosmic and updating `rev` below.
[dependencies.libcosmic]
git = "https://github.com/NotTimm/libcosmic.git"
rev = "b30d948887892894d86e3e9401a93ea509ebacf6"
default-features = false
features = ["dbus-config", "wgpu", "wayland", "winit", "tokio", "xdg-portal", "multi-window"]

[profile.release]
lto = true
